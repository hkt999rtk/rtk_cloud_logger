name: Release Bundle

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version. Defaults to the git ref name or timestamped short SHA."
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  package:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    name: Package release
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Select version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            version="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="ci-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::12}"
          fi
          case "$version" in
            *[!A-Za-z0-9._-]* | "" | .* | *..*)
              echo "invalid version: use only letters, digits, dot, underscore, and dash" >&2
              exit 1
              ;;
          esac
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Run release validation
        run: |
          set -euxo pipefail
          git diff --check
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          go mod tidy -diff
          go test ./...

      - name: Build release bundle
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          artifact_name="rtk_cloud_logger"
          bundle_root="dist/$artifact_name-$VERSION"
          object_bundle="dist/$VERSION.tar.gz"
          checksum="$object_bundle.sha256"
          manifest="dist/$VERSION.object-manifest.json"

          rm -rf dist
          mkdir -p "$bundle_root"
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C "$bundle_root"
          cat > "$bundle_root/release-manifest.json" <<EOF_MANIFEST
          {
            "artifact_name": "$artifact_name",
            "created_at": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')",
            "distribution": "internal-artifact",
            "repo": "$GITHUB_REPOSITORY",
            "schema_version": 1,
            "source_commit": "$GITHUB_SHA",
            "version": "$VERSION"
          }
          EOF_MANIFEST

          tar -czf "$object_bundle" -C dist "$artifact_name-$VERSION"
          sha256="$(shasum -a 256 "$object_bundle" | awk '{print $1}')"
          printf '%s  %s\n' "$sha256" "$VERSION.tar.gz" > "$checksum"
          python3 - <<'PY' > "$manifest"
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          version = os.environ["VERSION"]
          artifact_name = "rtk_cloud_logger"
          checksum = Path(f"dist/{version}.tar.gz.sha256").read_text(encoding="utf-8").split()[0]
          print(json.dumps({
              "artifact_name": artifact_name,
              "artifact_path": f"releases/{artifact_name}-{version}/{version}.tar.gz",
              "bundle": f"{version}.tar.gz",
              "checksum_path": f"releases/{artifact_name}-{version}/{version}.tar.gz.sha256",
              "created_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "manifest_path": f"releases/{artifact_name}-{version}/manifest.json",
              "repo": os.environ["GITHUB_REPOSITORY"],
              "schema_version": 1,
              "sha256": checksum,
              "source_commit": os.environ["GITHUB_SHA"],
              "version": version,
          }, indent=2, sort_keys=True))
          PY

      - name: Upload release objects to Linode Object Storage
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LINODE_OBJ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LINODE_OBJ_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.LINODE_OBJ_REGION || secrets.LINODE_OBJ_REGION || 'us-sea' }}
          AWS_EC2_METADATA_DISABLED: "true"
          LINODE_OBJ_BUCKET: ${{ vars.LINODE_OBJ_BUCKET || secrets.LINODE_OBJ_BUCKET }}
          LINODE_OBJ_ENDPOINT: ${{ vars.LINODE_OBJ_ENDPOINT || secrets.LINODE_OBJ_ENDPOINT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$LINODE_OBJ_BUCKET"
          test -n "$LINODE_OBJ_ENDPOINT"
          prefix="releases/rtk_cloud_logger-$VERSION"
          go run ./cmd/linode-object-storage put --file "dist/$VERSION.tar.gz" --key "$prefix/$VERSION.tar.gz"
          go run ./cmd/linode-object-storage put --file "dist/$VERSION.tar.gz.sha256" --key "$prefix/$VERSION.tar.gz.sha256"
          go run ./cmd/linode-object-storage put --file "dist/$VERSION.object-manifest.json" --key "$prefix/manifest.json"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          assets=(
            "dist/$VERSION.tar.gz"
            "dist/$VERSION.tar.gz.sha256"
            "dist/$VERSION.object-manifest.json"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes --title "$GITHUB_REF_NAME"
          fi

  publish-image:
    name: Publish LKE image
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Select image tags
        id: image
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}/rtk-cloud-logger"
          short_sha="${GITHUB_SHA::12}"
          tags=("$image:sha-$short_sha")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tags+=("$image:$GITHUB_REF_NAME")
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            tags+=("$image:$INPUT_VERSION")
          fi
          {
            printf 'image=%s\n' "$image"
            printf 'short_sha=%s\n' "$short_sha"
            printf 'tags<<EOF\n'
            printf '%s\n' "${tags[@]}"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Build smoke image
        shell: bash
        run: |
          set -euo pipefail
          docker build -t "${{ steps.image.outputs.image }}:local-smoke" -f Dockerfile .
          docker run --rm --entrypoint /bin/sh "${{ steps.image.outputs.image }}:local-smoke" -c \
            'test -x /usr/local/bin/rtk-cloud-logger'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Write image manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/lke-image
          cat > .artifacts/lke-image/image-manifest.json <<JSON
          {
            "schema": "rtk-service-image/v1",
            "repository": "${GITHUB_REPOSITORY}",
            "image": "${{ steps.image.outputs.image }}",
            "source_commit": "${GITHUB_SHA}",
            "primary_tag": "sha-${{ steps.image.outputs.short_sha }}"
          }
          JSON
          cat .artifacts/lke-image/image-manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image manifest
        uses: actions/upload-artifact@v4
        with:
          name: image-manifest
          path: .artifacts/lke-image/image-manifest.json
          if-no-files-found: error
