name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, rtk-cloud-logger-ci]
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Check module tidiness
        run: go mod tidy -diff

      - name: Run tests
        run: go test ./...

      - name: Build Linux logger binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          GOOS=linux GOARCH=amd64 go build -o dist/bin/rtk-cloud-logger ./cmd/rtk-cloud-logger
          GOOS=linux GOARCH=amd64 go build -o dist/bin/rtk-cloud-log-forwarder ./cmd/rtk-cloud-log-forwarder
          file dist/bin/rtk-cloud-logger | grep -q 'ELF 64-bit.*x86-64'
          file dist/bin/rtk-cloud-log-forwarder | grep -q 'ELF 64-bit.*x86-64'

      - name: Build container image
        run: docker build -t rtk-cloud-logger:ci .
